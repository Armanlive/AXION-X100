[package]
name = "axion-core"
version = "1.0.0"
description = "AXION Core Workspace Security Boundary and Filesystem Engine"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO"
] }

[dev-dependencies]
tempfile = "3.17"
