[package]
name = "axion-x100"
version = "1.0.0"
description = "AXION-X100 Local-First AI Development Workspace"
authors = ["AXION Core Team"]
edition = "2021"

[lib]
name = "axion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
axion-core = { path = "crates/axion-core" }
tauri = { version = "2.2.4", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.17"
