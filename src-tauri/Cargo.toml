[package]
name = "axion-x100"
version = "1.0.0"
description = "AXION-X100 Local-First AI Development Workspace"
authors = ["AXION Core Team"]
edition = "2021"

[lib]
name = "axion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri-plugin-opener = "2"
axion-core = { path = "crates/axion-core" }
tauri = { version = "2.2.4", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
walkdir = "2.5"

tempfile = "3.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
portable-pty = "0.9"
rfd = "0.17"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }


